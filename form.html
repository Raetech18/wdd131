
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review by rating the product, sharing useful features, and providing optional feedback.">
    <meta name="author" content="Racheal Pelumi Nwachukwu">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/product.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header class="site-header">
        <h1>Review a product</h1>
        <p>Tell us how it's working out. Fields marked * are required.</p>
    </header>

    <main>
        <form action="review.html" method="get">

            <div class="field">
                <label for="product">Product name *</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="field">
                <legend>Overall rating *</legend>

                <div class="stars">
                    <input
                        type="radio"
                        id="rating-5"
                        name="rating"
                        value="5"
                        required
                    >
                    <label for="rating-5" title="5 stars">
                        <span class="sr-only">5 stars</span>
                    </label>

                    <input
                        type="radio"
                        id="rating-4"
                        name="rating"
                        value="4"
                        required
                    >
                    <label for="rating-4" title="4 stars">
                        <span class="sr-only">4 stars</span>
                    </label>

                    <input
                        type="radio"
                        id="rating-3"
                        name="rating"
                        value="3"
                        required
                    >
                    <label for="rating-3" title="3 stars">
                        <span class="sr-only">3 stars</span>
                    </label>

                    <input
                        type="radio"
                        id="rating-2"
                        name="rating"
                        value="2"
                        required
                    >
                    <label for="rating-2" title="2 stars">
                        <span class="sr-only">2 stars</span>
                    </label>

                    <input
                        type="radio"
                        id="rating-1"
                        name="rating"
                        value="1"
                        required
                    >
                    <label for="rating-1" title="1 star">
                        <span class="sr-only">1 star</span>
                    </label>
                </div>
            </fieldset>

            <div class="field">
                <label for="install-date">Date of installation *</label>
                <input
                    type="date"
                    id="install-date"
                    name="installdate"
                    required
                >
            </div>

            <fieldset class="field">
                <legend>Useful features</legend>

                <div class="check">
                    <input
                        type="checkbox"
                        id="feat-durability"
                        name="features"
                        value="durability"
                    >
                    <label for="feat-durability">Durability</label>
                </div>

                <div class="check">
                    <input
                        type="checkbox"
                        id="feat-ease"
                        name="features"
                        value="ease-of-use"
                    >
                    <label for="feat-ease">Ease of use</label>
                </div>

                <div class="check">
                    <input
                        type="checkbox"
                        id="feat-power"
                        name="features"
                        value="power-efficiency"
                    >
                    <label for="feat-power">Power efficiency</label>
                </div>

                <div class="check">
                    <input
                        type="checkbox"
                        id="feat-design"
                        name="features"
                        value="design"
                    >
                    <label for="feat-design">Design</label>
                </div>
            </fieldset>

            <div class="field">
                <label for="review">Written review</label>
                <textarea
                    id="review"
                    name="review"
                    rows="5"
                    placeholder="What did you like or dislike?"
                ></textarea>
            </div>

            <div class="field">
                <label for="username">Your name</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="name"
                    placeholder="Optional"
                >
            </div>

            <input type="submit" value="Submit review">
        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Racheal Pelumi Nwachukwu | Nigeria
        </p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
